name: PowerShell validation

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
              $failed = $true
            } else {
              Write-Host "OK $($_.FullName)"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate JSON manifests
        shell: pwsh
        run: |
          Get-Content .\config\components.json -Raw | ConvertFrom-Json | Out-Null
          Write-Host "components.json OK"
